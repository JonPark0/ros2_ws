robocup_planner:
  ros__parameters:
    side: "a"
    task_topic: "/eai/task"
    nav_action: "navigate_to_station"
    wb_action: "wb_task"
    arm_service: "/amr_robot_command"
    wb_ready_topic: "/workbench/product_ready"
    post_process_service: "/robocup_navigator/post_process"
    cmd_vel_topic: "cmd_vel"
    wb_recycle_wait_mode: "auto"     # auto: 마지막 recycle은 WB 옆 대기, always/never 선택 가능
    wb_produce_parallelism: 2          # workbench 로봇팔 2대 기준
    wb_clearance_backup_distance: 0.10 # WB 대기 시 회전 없이 10cm 후진
    wb_clearance_backup_speed: 0.10
    motion_period_sec: 0.05
    product_weights_json: ""
    # Bounded-wait / self-recovery: blocking ROS2 calls time out and retry
    # instead of hanging the executor thread forever on a dead server.
    nav_timeout_sec: 60.0
    arm_timeout_sec: 30.0
    wb_timeout_sec: 120.0
    call_max_retries: 2
    nav_cancel_grace_sec: 5.0
    # Produce orders that are also deferred-recycle orders (lifecycle
    # produce-then-recycle) get their cargo-slot priority multiplied so they
    # clear the produce→deliver→reclaim loop early.
    deferred_recycle_priority_boost: 1000.0
    driving_velocity: 0.5
    parking_duration: 1.5
    exiting_duration: 1.0
    # Debug: export full plan result to JSON file before execution.
    # Set debug_export_dir to an absolute path to override the default (/tmp/robocup_planner).
    debug_export: true
    debug_export_dir: "/tmp/robocup_planner"

order_server:
  ros__parameters:
    task_topic: "/eai/task"
    auto_publish: true
    start_side: "a"
    mode: "preset"
    tier: "beginner"
    stage: "production"

mock_nav_node:
  ros__parameters:
    side: "a"
    delay_sec: 1.0
    use_distance_time: false
    amr_speed_mps: 0.50
    nav_overhead_sec: 0.0
    post_process_delay_sec: 0.0

mock_arm_node:
  ros__parameters:
    load_time_sec_per_item: 2.0
    unload_time_sec_per_item: 2.0
    amr_assemble_time_sec_per_connection: 4.0
    amr_assemble_base_time_sec: 0.0
    fallback_delay_sec: 0.5

mock_wb_node:
  ros__parameters:
    produce_time_sec_per_connection: 5.0
    recycle_time_sec_per_connection: 3.0
    unknown_product_delay_sec: 0.5
